{% extends "index.html" %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="glass-card animate-fade-in">
                <h2 class="text-center mb-4">
                    <i class="fas fa-flask text-success me-2"></i><span data-i18n="title_fertilizer">Fertilizer Recommendation</span>
                </h2>
                <form action="/predict-fertilizer" method="POST">
                    <input type="hidden" name="lang" class="lang-input" value="en">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="lbl_nitrogen">Nitrogen (N)</label>
                            <input type="number" class="form-control" name="nitrogen" required
                                data-i18n-ph="ph_n" placeholder="Example: 50" value="{{ input_data['nitrogen'] if input_data else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="lbl_phosphorus">Phosphorus (P)</label>
                            <input type="number" class="form-control" name="phosphorus" required
                                data-i18n-ph="ph_p" placeholder="Example: 50" value="{{ input_data['phosphorus'] if input_data else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="lbl_potassium">Potassium (K)</label>
                            <input type="number" class="form-control" name="potassium" required
                                data-i18n-ph="ph_k" placeholder="Example: 50" value="{{ input_data['potassium'] if input_data else '' }}">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label" data-i18n="lbl_crop_type">Crop Type</label>
                            <select class="form-select bg-dark text-white border-secondary" name="crop">
                                <option value="Barley" data-i18n="crop_barley" {% if input_data and input_data['crop'] == 'Barley' %}selected{% endif %}>Barley</option>
                                <option value="Cotton" data-i18n="crop_cotton" {% if input_data and input_data['crop'] == 'Cotton' %}selected{% endif %}>Cotton</option>
                                <option value="Ground Nuts" data-i18n="crop_groundnuts" {% if input_data and input_data['crop'] == 'Ground Nuts' %}selected{% endif %}>Ground Nuts</option>
                                <option value="Maize" data-i18n="crop_maize" {% if input_data and input_data['crop'] == 'Maize' %}selected{% endif %}>Maize</option>
                                <option value="Millets" data-i18n="crop_millets" {% if input_data and input_data['crop'] == 'Millets' %}selected{% endif %}>Millets</option>
                                <option value="Oil seeds" data-i18n="crop_oilseeds" {% if input_data and input_data['crop'] == 'Oil seeds' %}selected{% endif %}>Oil seeds</option>
                                <option value="Paddy" data-i18n="crop_paddy" {% if input_data and input_data['crop'] == 'Paddy' %}selected{% endif %}>Paddy / Rice</option>
                                <option value="Pulses" data-i18n="crop_pulses" {% if input_data and input_data['crop'] == 'Pulses' %}selected{% endif %}>Pulses</option>
                                <option value="Sugarcane" data-i18n="crop_sugarcane" {% if input_data and input_data['crop'] == 'Sugarcane' %}selected{% endif %}>Sugarcane</option>
                                <option value="Tobacco" data-i18n="crop_tobacco" {% if input_data and input_data['crop'] == 'Tobacco' %}selected{% endif %}>Tobacco</option>
                                <option value="Wheat" data-i18n="crop_wheat" {% if input_data and input_data['crop'] == 'Wheat' %}selected{% endif %}>Wheat</option>
                            </select>
                        </div>
                    </div>
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-custom btn-lg" data-i18n="btn_get_fert">Get Recommendation</button>
                    </div>
                </form>

                {% if result %}
                <div class="alert alert-success mt-4 text-center animate-fade-in" role="alert">
                    <h4 class="alert-heading" data-i18n="res_fert_head">Recommended Fertilizer</h4>
                    <p class="display-6">{{ result }}</p>
                    <hr>
                    <p class="mb-0">{{ message }}</p>
                </div>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
